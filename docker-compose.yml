services:
  database:
    image: postgres:15-alpine
    container_name: hermes_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - hermes_db_data:/var/lib/postgresql/data

  backend:
    container_name: hermes_backend
    build:
      context: ./backend
    ports:
      - "3333:3333"
    volumes:
      - ./backend:/usr/app
      - /usr/app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY} 
      - BACKEND_URL=${BACKEND_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    depends_on:
      - database

  frontend:
    container_name: hermes_frontend
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    volumes:
      # A linha abaixo foi comentada para usar o código construído DENTRO da imagem
      # - ./frontend:/usr/app
      - /usr/app/node_modules
      - /usr/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL} 
    depends_on:
      - backend

volumes:
  hermes_db_data:
