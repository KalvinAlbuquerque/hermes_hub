services:
  database:
    image: postgres:15-alpine
    container_name: hermes_db
    restart: always
    environment:
      - POSTGRES_USER=${POSTGRES_USER}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
      - POSTGRES_DB=${POSTGRES_DB}
    volumes:
      - hermes_db_data:/var/lib/postgresql/data
    # ADICIONADO: Garante que o banco esteja pronto para receber conexões
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    container_name: hermes_backend
    build:
      context: ./backend
    volumes:
      - ./backend:/usr/app
      - /usr/app/node_modules
    environment:
      - DATABASE_URL=${DATABASE_URL}
      - JWT_SECRET=${JWT_SECRET}
      - SETTINGS_ENCRYPTION_KEY=${SETTINGS_ENCRYPTION_KEY}
      - BACKEND_URL=${BACKEND_URL}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
    # ALTERADO: Agora espera o 'healthcheck' do banco passar
    depends_on:
      database:
        condition: service_healthy

  frontend:
    container_name: hermes_frontend
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    ports:
      - "3000:3000"
    volumes:
      - /usr/app/node_modules
      - /usr/app/.next
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
    depends_on:
      - backend

volumes:
  hermes_db_data: